version: '3.8'

networks:
  lambda-net:
    driver: bridge

services:
  # ---------------------------------------------------------------------------
  # 1) SPEED LAYER - Kafka + Zookeeper
  # ---------------------------------------------------------------------------
  zookeeper:
    image: confluentinc/cp-zookeeper:7.3.0
    container_name: zookeeper
    networks:
      - lambda-net
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka:
    image: confluentinc/cp-kafka:7.3.0
    container_name: kafka
    networks:
      - lambda-net
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: 'zookeeper:2181'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,PLAINTEXT_INTERNAL://kafka:29092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
    volumes:
      - ./infra/kafka/config:/kafka/config

  init-kafka:
    build: ./infra/kafka
    container_name: init-kafka
    networks:
      - lambda-net
    depends_on:
      - kafka
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    restart: on-failure

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    networks:
      - lambda-net
    ports:
      - "8081:8080"
    depends_on:
      - kafka
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
  # ---------------------------------------------------------------------------
  # 2) DATA LAKE - MinIO
  # ---------------------------------------------------------------------------
  minio:
    image: minio/minio:latest
    container_name: minio
    networks:
      - lambda-net
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - ./data/minio:/data
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"

  init-minio:
    build: ./infra/minio
    container_name: init-minio
    networks:
      - lambda-net
    depends_on:
      - minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    restart: on-failure

  # ---------------------------------------------------------------------------
  # 3) SERVING LAYER - MySQL
  # ---------------------------------------------------------------------------
  mysql:
    image: mysql:8.0
    container_name: mysql
    networks:
      - lambda-net
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: lambda_db
      MYSQL_USER: user
      MYSQL_PASSWORD: password
    volumes:
      - ./data/mysql:/var/lib/mysql

  # ---------------------------------------------------------------------------
  # 4) BATCH LAYER - Airflow
  # ---------------------------------------------------------------------------
  airflow:
    image: apache/airflow:2.8.1
    container_name: airflow
    networks:
      - lambda-net
    depends_on:
      - mysql
    ports:
      - "8080:8080"
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: mysql+mysqlconnector://user:password@mysql:3306/lambda_db
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW_UID: 50000
    volumes:
      - ./infra/airflow/dags:/opt/airflow/dags
      - ./infra/airflow/logs:/opt/airflow/logs
      - ./infra/airflow/plugins:/opt/airflow/plugins
    command: >
      bash -c "
        airflow db init &&
        airflow users create --username admin --password admin --firstname Admin --lastname User --role Admin --email admin@example.com &&
        airflow webserver
      "

  # ---------------------------------------------------------------------------
  # 5) SERVING LAYER - DASHBOARD Streamlit
  # ---------------------------------------------------------------------------
  streamlit:
    build:
      context: ./apps/dashboard
    container_name: streamlit
    networks:
      - lambda-net
    ports:
      - "8501:8501"
    volumes:
      - ./apps/dashboard:/app
    depends_on:
      - mysql
      - kafka
  # ---------------------------------------------------------------------------
  # 6) SERVING LAYER - API DE INFERÊRNCIA
  # ---------------------------------------------------------------------------
  fraud-sentinel:
    build:
      context: ./apps/api/fraud_sentinel
    container_name: fraud-sentinel
    networks:
      - lambda-net
    ports:
      - "8000:8000"
    environment:
      PYTHONUNBUFFERED: "1"
      MODEL_STAGE: prod
      # MinIO
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      MINIO_BUCKET: ml-models
      MODEL_PREFIX: fraud-sentinel/prod

    volumes:
      # Logs da aplicação
      - ./apps/api/fraud_sentinel/logs:/app/logs

    depends_on:
      - minio

    restart: unless-stopped

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

